version: "3.9"

services:
  api:
    build: .
    container_name: company-chatbot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # IMPORTANT: override ONLY inside Docker
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"   # optional (for local testing)
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
